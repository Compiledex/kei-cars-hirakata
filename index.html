<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kei Cars in Hirakata — From the Street to the World</title>
<meta name="description" content="A map following the kei car from Hirakata's streets to Kansai, Japan and the world.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Noto+Sans+JP:wght@400;700&display=swap">

<body>

<nav id="tabs" role="tablist" aria-label="Scale"></nav>

    <button id="bSources" class="srcbtn">Sources</button>
  </div>
</section>

    <button id="mClose" class="close" aria-label="Close sources">×</button>

  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
